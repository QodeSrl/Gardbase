<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080e18" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f5f7fa" media="(prefers-color-scheme: light)" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem("gardbase-theme") || "dark";
          document.documentElement.classList.add(t === "light" ? "light" : "dark");
          document.documentElement.style.colorScheme = t === "light" ? "light" : "dark";
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
    <meta
      name="description"
      content="Open-source encrypted data infrastructure for AWS. Client-side object encryption, Nitro Enclave key operations, and DynamoDB + S3 storage. Apache 2.0."
    />
    <title>Gardbase — Keep sensitive data on your side</title>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
